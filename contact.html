</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Liberation War Archive

            <ul class="nav-links">

            </ul>

        </nav>

    </header>


    <!-- ================= CONTACT ================= -->

    <section class="section">

        <h1 class="section-title">
            Contact Us
        </h1>


        <div class="contact-container">

            <form id="contactForm"
                  onsubmit="submitForm(event)">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name *
                    </label>

                    <input type="text"
                           id="name"
                           placeholder="Enter your name">

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email *
                    </label>

                    <input type="email"
                           id="email"
                           placeholder="Enter your email">

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject">
                        Subject *
                    </label>

                    <input type="text"
                           id="subject"
                           placeholder="Enter subject">

                </div>


                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea id="message"
                              placeholder="Write your message">
                    </textarea>

                </div>


                <!-- SUBMIT -->

                <button type="submit"
                        class="btn">

                    Submit Message

                </button>


            </form>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        </p>

            Preserving History for Future Generations
